name: family_tales
description: "Family Tales - offline family tree and family history"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Local persistence (SQLite via drift, encrypted with SQLite3MultipleCiphers)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Security
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  crypto: ^3.0.8

  # Media & files
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  image: ^4.12.0
  archive: ^4.6.0

  # Export
  pdf: ^3.13.1
  printing: ^5.15.1

  # Local reminders
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Bundle SQLite3MultipleCiphers so the local database can be encrypted at rest
# (SQLCipher v4 compatible scheme). The library is bundled at build time; the
# app never downloads anything at runtime.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  assets:
    - assets/branding/emblem.png
    - assets/branding/logo_full.png
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/MIT-Phosphor.txt

  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/icon_square.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#15181E"
  adaptive_icon_foreground: "assets/branding/icon_adaptive_fg.png"

flutter_native_splash:
  color: "#0B0C0F"
  image: assets/branding/emblem.png
  android_12:
    color: "#0B0C0F"
    image: assets/branding/splash_android12.png
    icon_background_color: "#0B0C0F"
  ios: true
  android: true
  web: false
  fullscreen: false
